<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        let myArray = [4, 5, 6, 10, 12];
        let total1 = 0;

        for (let i = 0; i < myArray.length; i++) {
            total1 += myArray [i];
        }

        console.log(total1);

        let number = 0;
        let total2 = 0;

        while (number < 8) {
            number = Math.floor(Math.random () * 10 + 1);
            console.log(number);
            total2 += number;
        }
        console.log ("The sum of number < 8 is " + total2);

        let number2;
        let total3 = 0;

        do {
            number2 = Math.floor((Math.random() * 10) + 1);
            console.log(number2);
            total3 += number2;
        }
        while (number2 < 8);
        console.log("The sum of number is " + total3);

        let number3 = 3;
        let number4 = 5;
        console.log(number3 === number4);
        console.log(number3 !== number4);
        console.log(number3 > number4);
        console.log(number3 <= number4);
    </script>
</head>

</body>
</html>
