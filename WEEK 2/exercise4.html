<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Starter code
        let age = Number(prompt("Enter your age: "));
        // TODO: Complete the if-else statements
        // Age Categories
        // 0-12: Child
        // 13-19: Teenager
        // 20-64: Adult
        // 65+: Senior
        // Invalid: Less than 0

        if (age >= 0 && age <= 12) {
            console.log("Child");
        } else if (age >= 13 && age <= 19) {
            console.log("Teenager");
        } else if (age >= 20 && age <= 64) {
            console.log("Adult");
        } else if (age >= 65) {
            console.log("Senior");
        } else {
            console.log("Invalid age");
        }
    </script>
</head>
