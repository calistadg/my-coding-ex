<!DOCTYPE html>
<html>
<head>
<title>Table Example</title>
</head>
<body>
<h3>Table 1: Table with colspan and rowspan</h3>
<table border="1" width=""300">
<tr>
<td align="center" colspan="3">NAME</td>
</tr>
<tr>
<td align="center" rowspan="3">AGE</td>
<td align="center" colspan="2">EMAIL</td>
</tr>
<tr>
<td height="20"></td>
<td height="20"></td>
</tr>
<tr>
<td height="20"></td>
<td height="20"></td>   
</tr>
</body>
</html>
